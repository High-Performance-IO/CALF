syntax = "proto2";

package perfetto.protos;

// Minimal declarations of Perfetto's stable TrackEvent wire format. Field
// numbers match the upstream Perfetto protos, so these files open directly in
// the Perfetto UI and trace processor.
message Trace {
  repeated TracePacket packet = 1;
}

message TracePacket {
  optional uint64 timestamp = 8;
  optional uint32 trusted_packet_sequence_id = 10;
  optional TrackEvent track_event = 11;
  optional uint32 timestamp_clock_id = 58;
  optional TrackDescriptor track_descriptor = 60;
}

message TrackEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_SLICE_BEGIN = 1;
    TYPE_SLICE_END = 2;
    TYPE_INSTANT = 3;
  }

  repeated DebugAnnotation debug_annotations = 4;
  optional Type type = 9;
  optional uint64 track_uuid = 11;
  repeated string categories = 22;
  optional string name = 23;
  optional SourceLocation source_location = 33;
}

message DebugAnnotation {
  optional string string_value = 6;
  optional string name = 10;
}

message SourceLocation {
  optional string file_name = 2;
  optional string function_name = 3;
  optional uint32 line_number = 4;
}

message TrackDescriptor {
  optional uint64 uuid = 1;
  optional string name = 2;
  optional ThreadDescriptor thread = 4;
}

message ThreadDescriptor {
  optional int32 pid = 1;
  optional int64 tid = 2;
  optional string thread_name = 5;
}
