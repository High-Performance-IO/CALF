<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CALF Trace Explorer</title>
  <link rel="icon" href="/calf.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-mark" src="/calf.svg" alt="CALF"><div><strong>CALF Inspector</strong><small>Trace explorer</small></div></div>
    <div class="topbar-actions"><button class="add-column" id="add-column">+ Add column</button></div>
  </header>
  <main class="workspace"><div class="columns" id="columns"><div class="loading">Loading trace directories...</div></div></main>
  <section class="stats-panel" id="stats-panel" hidden>
    <div class="stats-head"><div><div class="eyebrow">Aggregated timings</div><h2 id="stats-title">Invoker statistics</h2></div><button class="btn" id="close-stats">Close</button></div>
    <div class="table-wrap"><table><thead><tr><th>Invoker</th><th>Calls</th><th>Total</th><th>Mean</th><th>Median</th><th>Max</th><th>Min</th><th>Std dev</th></tr></thead><tbody id="stats-body"></tbody></table></div>
  </section>
  <script src="/app.js" defer></script>
</body>
</html>
